document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

ook estreito ---------- */\n@media (max-width: 1024px) {\n  [style*=\"repeat(4,\"] { grid-template-columns: repeat(2, 1fr) !important; }\n  [style*=\"repeat(3,\"] { grid-template-columns: repeat(2, 1fr) !important; }\n  /* rodapé 5 colunas -> 3 */\n  [style*=\"1.8fr 1fr 1fr 1fr 1fr\"] { grid-template-columns: 1fr 1fr 1fr !important; gap: 32px !important; }\n}\n\n/* ---------- Celular ---------- */\n@media (max-width: 760px) {\n  /* todas as grades viram 1 coluna */\n  [style*=\"repeat(4,\"],\n  [style*=\"repeat(3,\"],\n  [style*=\"repeat(2,\"]            { grid-template-columns: 1fr !important; }\n  [style*=\"grid-template-columns: 1fr 1fr\"]   { grid-template-columns: 1fr !important; }\n  [style*=\"grid-template-columns: 1.1fr\"]     { grid-template-columns: 1fr !important; }\n  [style*=\"grid-template-columns: 1.15fr\"]    { grid-template-columns: 1fr !important; }\n  [style*=\"grid-template-columns: 1fr 1.7fr 1fr\"] { grid-template-columns: 1fr !important; }\n  /* rodapé -> 2 colunas */\n  [style*=\"1.8fr 1fr 1fr 1fr 1fr\"] { grid-template-columns: 1fr 1fr !important; gap: 28px 24px !important; }\n\n  /* respiro lateral mais justo */\n  section { padding-left: 20px !important; padding-right: 20px !important; }\n  footer  { padding-left: 24px !important; padding-right: 24px !important; }\n\n  /* topos de hero muito altos (atrás do nav fixo) */\n  [style*=\"padding: 160px\"] { padding-top: 108px !important; padding-bottom: 56px !important; }\n  [style*=\"padding: 150px\"] { padding-top: 104px !important; }\n\n  /* paddings internos grandes de cards/CTAs */\n  [style*=\"padding: 64px 56px\"] { padding: 36px 24px !important; }\n  [style*=\"padding: 52px 48px\"] { padding: 32px 22px !important; }\n  [style*=\"padding: 48px 48px\"] { padding: 28px 22px !important; }\n\n  /* fotos de time com altura fixa -> menores */\n  [style*=\"clamp(340px, 38vw, 500px)\"] { height: 230px !important; }\n\n  /* CTA final da home: empilha e alinha à esquerda */\n  .home-cta-card { grid lay:flex;align-items:center;gap:9px;border:1px solid rgba(240,239,235,0.22);border-radius:100px;padding:10px 20px;font-size:13px;font-weight:600;letter-spacing:0.02em;color:#F0EFEB;text-decoration:none;margin-left:8px;\"><span style=\"font-size:15px;\">🗓<\u002Fspan> Adicionar à minha agenda<\u002Fa>\n    <\u002Fnav>\n  <\u002Fheader>\n\n  <main class=\"summit-grid\" style=\"position:relative;z-index:1;display:grid;grid-template-columns:1.08fr 0.92fr;gap:clamp(32px,5vw,72px);align-items:center;max-width:1240px;margin:0 auto;padding:clamp(20px,3vw,44px) clamp(24px,5vw,64px) 60px;\">\n\n    <div class=\"summit-left\">\n      <span style=\"display:inline-block;font-size:13px;font-weight:700;letter-spacing:0.22em;text-transform:uppercase;color:#FF4A2E;margin-bottom:16px;\">1ª edição<\u002Fspan>\n      <h1 style=\"margin:0;line-height:0.92;letter-spacing:-0.03em;\">\n        <span style=\"display:block;font-size:clamp(56px,8vw,104px);font-weight:700;color:#F0EFEB;\">Arvo<\u002Fspan>\n        <span style=\"display:block;font-family:'Playfair Display',Georgia,serif;font-style:italic;font-weight:500;font-size:clamp(58px,8.4vw,112px);color:#EDE7DA;margin-top:-0.04em;\">Summit<\u002Fspan>\n      <\u002Fh1>\n      <div class=\"summit-tagline\" style=\"display:flex;align-items:flex-start;gap:12px;margin-top:26px;max-width:440px;\">\n        <span style=\"width:9px;height:9px;border-radius:50%;background:#FF4A2E;flex-shrink:0;margin-top:8px;\"><\u002Fspan>\n        <p style=\"font-size:clamp(15px,1.7vw,18px);font-weight:600;letter-spacing:0.02em;text-transform:uppercase;color:rgba(240,239,235,0.9);line-height:1.4;margin:0;\">Como a IA redefine os ganhos de eficiência em saúde<\u002Fp>\n      <\u002Fdiv>\n\n      <div class=\"summit-meta\" style=\"display:flex;gap:clamp(28px,4vw,56px);margin-top:44px;flex-wrap:nowrap;\">\n        <div>\n          <div style=\"font-size:11px;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;color:rgba(240,239,235,0.45);margin-bottom:10px;\">Quando<\u002Fdiv>\n          <div style=\"font-size:clamp(24px,2.6vw,32px);font-weight:700;color:#F0EFEB;letter-spacing:-0.02em;line-height:1;white-space:nowrap;\">20 <span style=\"font-family:'Playfair Display',Georgia,serif;font-style:italic;font-weight:500;\">de agosto<\u002Fspan><\u002Fdiv>\n          <div style=\"font-size:13px;letter-spacing:0.06em;color:rgba(240,239,235,0.55);margin-top:8px;\">Quinta-feira · 2026<\u002Fdiv>\n          <div style=\"font-size:13px;font-weight:600;letter-spacing:0.02em;color:#E5C8C5;margin-top:6px;\">A partir das 8h30<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"width:1px;background:rgba(240,239,235,0.14);align-self:stretch;\"><\u002Fdiv>\n        <div>\n          <div style=\"font-size:11px;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;color:rgba(240,239,235,0.45);margin-bottom:10px;\">Onde<\u002Fdiv>\n          <div style=\"font-size:clamp(24px,2.6vw,32px);font-weight:700;color:#F0EFEB;letter-spacing:-0.02em;line-height:1.05;\">Pocket House<br>Villa Lobos<\u002Fdiv>\n          <div style=\"font-size:13px;letter-spacing:0.02em;color:rgba(240,239,235,0.55);margin-top:8px;line-height:1.5;\">Av. Prof. Fonseca Rodrigues, 689<br>Alto de Pinheiros, São Paulo · SP<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"summit-ans-hero\" style=\"display:inline-flex;align-items:center;gap:11px;margin-top:30px;background:rgba(144,43,41,0.16);border:1px solid rgba(255,74,46,0.4);border-radius:100px;padding:11px 20px;\">\n        <span style=\"width:8px;height:8px;border-radius:50%;background:#FF4A2E;flex-shrink:0;animation:summitPulse 1.6s infinite;\"><\u002Fspan>\n        <span style=\"font-size:13px;font-weight:600;color:#E5C8C5;letter-spacing:0.01em;\">Presença confirmada do Presidente da ANS<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"summit-right\" id=\"confirmar\" style=\"scroll-margin-top:90px;\">\n      <div style=\"background:rgba(20,20,24,0.72);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(240,239,235,0.13);border-radius:22px;padding:clamp(28px,3vw,40px);box-shadow:0 40px 110px rgba(0,0,0,0.55);\">\n        <div style=\"font-size:11px;font-weight:700;letter-spacing:0.13em;text-transform:uppercase;color:#FF4A2E;margin-bottom:6px;\">Garanta seu lugar<\u002Fdiv>\n        <div style=\"font-size:23px;font-weight:700;color:#F0EFEB;letter-spacing:-0.02em;margin-bottom:6px;\">Confirmar presença<\u002Fdiv>\n        <p style=\"font-size:14px;color:rgba(240,239,235,0.55);line-height:1.5;margin:0 0 22px;\">Vagas limitadas. Preencha os dados para garantir seu lugar — enviaremos os detalhes finais por e-mail.<\u002Fp>\n        <div id=\"hs-form-container\"><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fmain>\n\n  <section style=\"position:relative;z-index:1;max-width:1240px;margin:0 auto;padding:20px clamp(24px,5vw,64px) 80px;\">\n    <div style=\"margin-bottom:38px;\">\n      <span style=\"display:inline-block;font-size:13px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#902B29;margin-bottom:14px;\">Temas centrais<\u002Fspan>\n      <h2 style=\"font-size:clamp(28px,3.6vw,44px);font-weight:700;letter-spacing:-0.03em;line-height:1.08;color:#F0EFEB;margin:0;max-width:820px;\">IA em saúde: <em style=\"font-style:italic;font-family:'Playfair Display',Georgia,serif;color:#E5C8C5;font-weight:400;\">do discurso ao valor real.<\u002Fem><\u002Fh2>\n    <\u002Fdiv>\n\n    <div class=\"summit-agenda-grid\" style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:16px;\">\n      <div style=\"background:rgba(255,255,255,0.04);border:1px solid rgba(240,239,235,0.1);border-radius:18px;padding:32px 28px;\">\n        <div style=\"font-size:12px;font-weight:700;color:#FF4A2E;letter-spacing:0.16em;text-transform:uppercase;margin-bottom:16px;\">01<\u002Fdiv>\n        <div style=\"font-size:20px;font-weight:600;color:#F0EFEB;letter-spacing:-0.01em;line-height:1.25;margin-bottom:12px;\">O impacto real da IA na operação<\u002Fdiv>\n        <p style=\"font-size:14px;color:rgba(240,239,235,0.58);line-height:1.65;margin:0;\">Como operadoras estão usando IA para reduzir despesa assistencial e ganhar visibilidade sobre dados que antes eram opacos.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:rgba(255,255,255,0.04);border:1px solid rgba(240,239,235,0.1);border-radius:18px;padding:32px 28px;\">\n        <div style=\"font-size:12px;font-weight:700;color:#FF4A2E;letter-spacing:0.16em;text-transform:uppercase;margin-bottom:16px;\">02<\u002Fdiv>\n        <div style=\"font-size:20px;font-weight:600;color:#F0EFEB;letter-spacing:-0.01em;line-height:1.25;margin-bottom:12px;\">Gestão preditiva da despesa<\u002Fdiv>\n        <p style=\"font-size:14px;color:rgba(240,239,235,0.58);line-height:1.65;margin:0;\">Como IA e tecnologia estão mudando a gestão da despesa assistencial, identificando padrões de risco antes que virem custo.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:rgba(255,255,255,0.04);border:1px solid rgba(240,239,235,0.1);border-radius:18px;padding:32px 28px;\">\n        <div style=\"font-size:12px;font-weight:700;color:#FF4A2E;letter-spacing:0.16em;text-transform:uppercase;margin-bottom:16px;\">03<\u002Fdiv>\n        <div style=\"font-size:20px;font-weight:600;color:#F0EFEB;letter-spacing:-0.01em;line-height:1.25;margin-bottom:12px;\">Lideranças no centro da discussão<\u002Fdiv>\n        <p style=\"font-size:14px;color:rgba(240,239,235,0.58);line-height:1.65;margin:0;\">Executivos, gestores e lideranças de saúde suplementar reunidos para discutir o que já chegou à operação e o que ainda vive no campo das promessas.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"agenda\" style=\"position:relative;z-index:1;max-width:1240px;margin:0 auto;padding:0 clamp(24px,5vw,64px) 100px;scroll-margin-top:90px;\">\n    <div style=\"margin-bottom:28px;\">\n      <span style=\"display:inline-block;font-size:13px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#902B29;margin-bottom:14px;\">Programação<\u002Fspan>\n      <h2 style=\"font-size:clamp(28px,3.6vw,44px);font-weight:700;letter-spacing:-0.03em;line-height:1.08;color:#F0EFEB;margin:0;\">Confira a <em style=\"font-style:italic;font-family:'Playfair Display',Georgia,serif;color:#E5C8C5;font-weight:400;\">agenda do evento.<\u002Fem><\u002Fh2>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:12px;\">\n      <div class=\"summit-slot\" style=\"display:grid;grid-template-columns:150px 1fr;gap:24px;align-items:start;background:rgba(255,255,255,0.04);border:1px solid rgba(240,239,235,0.1);border-radius:16px;padding:24px 28px;\">\n        <div class=\"summit-slot-time\" style=\"font-size:16px;font-weight:700;color:#FF4A2E;letter-spacing:-0.01em;white-space:nowrap;\">8h30–9h45<\u002Fdiv>\n        <div>\n          <div style=\"font-size:18px;font-weight:600;color:#F0EFEB;line-height:1.3;\">Coffee + Credenciamento<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"summit-slot\" style=\"display:grid;grid-template-columns:150px 1fr;gap:24px;align-items:start;background:rgba(255,255,255,0.04);border:1px solid rgba(240,239,235,0.1);border-radius:16px;padding:24px 28px;\">\n        <div class=\"summit-slot-time\" style=\"font-size:16px;font-weight:700;color:#FF4A2E;letter-spacing:-0.01em;white-space:nowrap;\">9h45–10h30<\u002Fdiv>\n        <div>\n          <div style=\"font-size:18px;font-weight:600;color:#F0EFEB;line-height:1.3;\">Abertura oficial do Arvo Summit<\u002Fdiv>\n          <p style=\"font-size:14px;color:rgba(240,239,235,0.6);line-height:1.6;margin:6px 0 0;\">Fabricio Valadão (CEO e cofundador da Arvo) e Wadih Damous (Presidente da ANS).<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"summit-slot\" style=\"display:grid;grid-template-columns:150px 1fr;gap:24px;align-items:start;background:rgba(144,43,41,0.14);border:1px solid rgba(255,74,46,0.28);border-radius:16px;padding:24px 28px;\">\n        <div class=\"summit-slot-time\" style=\"font-size:16px;font-weight:700;color:#FF4A2E;letter-spacing:-0.01em;white-space:nowrap;\">10h30–11h15<\u002Fdiv>\n        <div>\n          <span style=\"display:inline-block;font-size:11px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:#E5C8C5;margin-bottom:8px;\">Painel<\u002Fspan>\n          <div style=\"font-size:18px;font-weight:600;color:#F0EFEB;line-height:1.3;\">Do conceito ao resultado: como a IA move receita, custo e saúde<\u002Fdiv>\n          <p style=\"font-size:14px;color:rgba(240,239,235,0.45);line-height:1.6;margin:6px 0 0;\">Em breve<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"summit-slot\" style=\"display:grid;grid-template-columns:150px 1fr;gap:24px;align-items:start;background:rgba(255,255,255,0.04);border:1px solid rgba(240,239,235,0.1);border-radius:16px;padding:24px 28px;\">\n        <div class=\"summit-slot-time\" style=\"font-size:16px;font-weight:700;color:#FF4A2E;letter-spacing:-0.01em;white-space:nowrap;\">11h15–12h30<\u002Fdiv>\n        <div>\n          <div style=\"font-size:18px;font-weight:600;color:#F0EFEB;line-height:1.3;\">Coffee Break: Anamnese do Mercado<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"summit-slot\" style=\"display:grid;grid-template-columns:150px 1fr;gap:24px;align-items:start;background:rgba(144,43,41,0.14);border:1px solid rgba(255,74,46,0.28);border-radius:16px;padding:24px 28px;\">\n        <div class=\"summit-slot-time\" style=\"font-size:16px;font-weight:700;color:#FF4A2E;letter-spacing:-0.01em;white-space:nowrap;\">12h30–13h15<\u002Fdiv>\n        <div>\n          <span style=\"display:inline-block;font-size:11px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:#E5C8C5;margin-bottom:8px;\">Painel<\u002Fspan>\n          <div style=\"font-size:18px;font-weight:600;color:#F0EFEB;line-height:1.3;\">IA como alavanca de confiança entre operadoras e prestadores de saúde<\u002Fdiv>\n          <p style=\"font-size:14px;color:rgba(240,239,235,0.45);line-height:1.6;margin:6px 0 0;\">Em breve<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"summit-slot\" style=\"display:grid;grid-template-columns:150px 1fr;gap:24px;align-items:start;background:rgba(144,43,41,0.14);border:1px solid rgba(255,74,46,0.28);border-radius:16px;padding:24px 28px;\">\n        <div class=\"summit-slot-time\" style=\"font-size:16px;font-weight:700;color:#FF4A2E;letter-spacing:-0.01em;white-space:nowrap;\">13h15–14h15<\u002Fdiv>\n        <div>\n          <span style=\"display:inline-block;font-size:11px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:#E5C8C5;margin-bottom:8px;\">Painel<\u002Fspan>\n          <div style=\"font-size:18px;font-weight:600;color:#F0EFEB;line-height:1.3;\">IA e os novos desafios da gestão em saúde<\u002Fdiv>\n          <p style=\"font-size:14px;color:rgba(240,239,235,0.45);line-height:1.6;margin:6px 0 0;\">Em breve<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"summit-slot\" style=\"display:grid;grid-template-columns:150px 1fr;gap:24px;align-items:start;background:rgba(255,255,255,0.04);border:1px solid rgba(240,239,235,0.1);border-radius:16px;padding:24px 28px;\">\n        <div class=\"summit-slot-time\" style=\"font-size:16px;font-weight:700;color:#FF4A2E;letter-spacing:-0.01em;white-space:nowrap;\">14h15–15h15<\u002Fdiv>\n        <div>\n          <div style=\"font-size:18px;font-weight:600;color:#F0EFEB;line-height:1.3;\">Coffee Break: Raio-X do Desperdício<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"summit-slot\" style=\"display:grid;grid-template-columns:150px 1fr;gap:24px;align-items:start;background:rgba(144,43,41,0.14);border:1px solid rgba(255,74,46,0.28);border-radius:16px;padding:24px 28px;\">\n        <div class=\"summit-slot-time\" style=\"font-size:16px;font-weight:700;color:#FF4A2E;letter-spacing:-0.01em;white-space:nowrap;\">15h15–16h<\u002Fdiv>\n        <div>\n          <span style=\"display:inline-block;font-size:11px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:#E5C8C5;margin-bottom:8px;\">Painel<\u002Fspan>\n          <div style=\"font-size:18px;font-weight:600;color:#F0EFEB;line-height:1.3;\">Agentes autônomos, produtividade real e segurança com IA<\u002Fdiv>\n          <p style=\"font-size:14px;color:rgba(240,239,235,0.45);line-height:1.6;margin:6px 0 0;\">Em breve<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"summit-slot\" style=\"display:grid;grid-template-columns:150px 1fr;gap:24px;align-items:start;background:rgba(255,255,255,0.04);border:1px solid rgba(240,239,235,0.1);border-radius:16px;padding:24px 28px;\">\n        <div class=\"summit-slot-time\" style=\"font-size:16px;font-weight:700;color:#FF4A2E;letter-spacing:-0.01em;white-space:nowrap;\">16h–16h40<\u002Fdiv>\n        <div>\n          <div style=\"font-size:18px;font-weight:600;color:#F0EFEB;line-height:1.3;\">Encerramento<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"font-size:13px;color:rgba(240,239,235,0.4);letter-spacing:0.06em;text-transform:uppercase;margin:22px 0 0;\">*Agenda sujeita a alterações.<\u002Fp>\n  <\u002Fsection>\n\n  <section id=\"painelistas\" style=\"position:relative;z-index:1;max-width:1240px;margin:0 auto;padding:0 clamp(24px,5vw,64px) 110px;scroll-margin-top:90px;\">\n    <div style=\"margin-bottom:34px;\">\n      <span style=\"display:inline-block;font-size:13px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#902B29;margin-bottom:14px;\">Painelistas<\u002Fspan>\n      <h2 style=\"font-size:clamp(28px,3.6vw,44px);font-weight:700;letter-spacing:-0.03em;line-height:1.08;color:#F0EFEB;margin:0;\">Quem conduz as <em style=\"font-style:italic;font-family:'Playfair Display',Georgia,serif;color:#E5C8C5;font-weight:400;\">conversas.<\u002Fem><\u002Fh2>\n    <\u002Fdiv>\n\n    <div class=\"summit-speakers-grid\" style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:18px;\">\n      <div style=\"background:rgba(255,255,255,0.04);border:1px solid rgba(240,239,235,0.1);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;\">\n        <div style=\"aspect-ratio:1/1;width:100%;background:url(&quot;b9ef3aa7-61d0-4afa-8fd8-95ce7a3d4ee7&quot;) center/cover;border-bottom:1px solid rgba(240,239,235,0.08);\"><\u002Fdiv>\n        <div style=\"padding:22px 22px 26px;\">\n          <div style=\"font-size:19px;font-weight:700;color:#F0EFEB;letter-spacing:-0.01em;\">Fabrício Valadão<\u002Fdiv>\n          <p style=\"font-size:13px;color:#FF6B5E;font-weight:600;margin:5px 0 12px;\">CEO e cofundador da Arvo<\u002Fp>\n          <p style=\"font-size:13px;color:rgba(240,239,235,0.6);line-height:1.55;margin:0;\">Executivo com mais de 14 anos de experiência em saúde na América Latina. Foi Gerente Sênior na Bain &amp; Company e Head de Estratégia em Saúde na AON.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background:rgba(255,255,255,0.04);border:1px solid rgba(240,239,235,0.1);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;\">\n        <div style=\"aspect-ratio:1/1;width:100%;background:url(&quot;1daf70dc-a8fb-4347-881c-f749d87599d4&quot;) center/cover;border-bottom:1px solid rgba(240,239,235,0.08);\"><\u002Fdiv>\n        <div style=\"padding:22px 22px 26px;\">\n          <div style=\"font-size:19px;font-weight:700;color:#F0EFEB;letter-spacing:-0.01em;\">Rafael Tinoco<\u002Fdiv>\n          <p style=\"font-size:13px;color:#FF6B5E;font-weight:600;margin:5px 0 12px;\">CPO e cofundador da Arvo<\u002Fp>\n          <p style=\"font-size:13px;color:rgba(240,239,235,0.6);line-height:1.55;margin:0;\">Executivo com mais de 15 anos no mercado, liderando times de produto em empresas de tecnologia voltadas à saúde. Acumula passagens na Alice e Wellhub.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background:rgba(255,255,255,0.04);border:1px solid rgba(240,239,235,0.1);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;\">\n        <div style=\"aspect-ratio:1/1;width:100%;background:url(&quot;ffe5ffa5-9e4d-4170-80fe-739c12182c25&quot;) center/cover;border-bottom:1px solid rgba(240,239,235,0.08);\"><\u002Fdiv>\n        <div style=\"padding:22px 22px 26px;\">\n          <div style=\"font-size:19px;font-weight:700;color:#F0EFEB;letter-spacing:-0.01em;\">Nathan Romeiro<\u002Fdiv>\n          <p style=\"font-size:13px;color:#FF6B5E;font-weight:600;margin:5px 0 12px;\">Líder de produto na Arvo<\u002Fp>\n          <p style=\"font-size:13px;color:rgba(240,239,235,0.6);line-height:1.55;margin:0;\">Experiência na construção de produtos digitais em mobilidade, e-commerce e saúde. Liderou novos negócios na healthtech Alice e foi eleito para a lista Forbes Under 30 em 2020.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background:rgba(144,43,41,0.16);border:1px solid rgba(255,74,46,0.3);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;\">\n        <div style=\"aspect-ratio:1/1;width:100%;background:url(&quot;8b7e4c8a-5cfa-44e1-9da6-17c71b255e4b&quot;) center 15%/cover;border-bottom:1px solid rgba(255,74,46,0.18);\"><\u002Fdiv>\n        <div style=\"padding:22px 22px 26px;\">\n          <span style=\"display:inline-block;font-size:10px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#FF4A2E;margin-bottom:8px;\">Participação especial<\u002Fspan>\n          <div style=\"font-size:19px;font-weight:700;color:#F0EFEB;letter-spacing:-0.01em;\">Wadih Damous<\u002Fdiv>\n          <p style=\"font-size:13px;color:#FF6B5E;font-weight:600;margin:5px 0 12px;\">Diretor-Presidente da ANS<\u002Fp>\n          <p style=\"font-size:13px;color:rgba(240,239,235,0.6);line-height:1.55;margin:0;\">Advogado e mestre em Direito Constitucional pela UERJ. Foi Presidente da OAB-RJ, Deputado Federal (2015–2019) e Secretário Nacional do Consumidor no Ministério da Justiça.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"margin-top:64px;\">\n      <div style=\"display:flex;align-items:center;gap:14px;margin-bottom:22px;\">\n        <span style=\"font-size:12px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#902B29;\">Painel<\u002Fspan>\n        <span style=\"flex:1;height:1px;background:rgba(240,239,235,0.12);\"><\u002Fspan>\n      <\u002Fdiv>\n      <h3 style=\"font-size:clamp(20px,2.4vw,28px);font-weight:700;letter-spacing:-0.02em;line-height:1.2;color:#F0EFEB;margin:0 0 24px;max-width:820px;\">IA como alavanca de confiança entre operadoras e prestadores de saúde<\u002Fh3>\n      <div class=\"summit-speakers-grid\" style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:18px;\">\n        <div style=\"background:rgba(255,255,255,0.04);border:1px solid rgba(240,239,235,0.1);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;\">\n          <div style=\"aspect-ratio:1/1;width:100%;background:url(&quot;ffe5ffa5-9e4d-4170-80fe-739c12182c25&quot;) center/cover;border-bottom:1px solid rgba(240,239,235,0.08);\"><\u002Fdiv>\n          <div style=\"padding:22px 22px 26px;\">\n            <div style=\"font-size:19px;font-weight:700;color:#F0EFEB;letter-spacing:-0.01em;\">Nathan Romeiro<\u002Fdiv>\n            <p style=\"font-size:13px;color:#FF6B5E;font-weight:600;margin:5px 0 12px;\">Líder de produto na Arvo<\u002Fp>\n            <p style=\"font-size:13px;color:rgba(240,239,235,0.6);line-height:1.55;margin:0;\">Experiência na construção de produtos digitais em mobilidade, e-commerce e saúde. Liderou novos negócios na healthtech Alice e foi eleito para a lista Forbes Under 30 em 2020.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:rgba(255,255,255,0.04);border:1px solid rgba(240,239,235,0.1);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;\">\n          <div style=\"aspect-ratio:1/1;width:100%;background:url(&quot;b5270e05-b96b-48c2-adfe-5beb512e63fc&quot;) center/cover;border-bottom:1px solid rgba(240,239,235,0.08);\"><\u002Fdiv>\n          <div style=\"padding:22px 22px 26px;\">\n            <div style=\"font-size:19px;font-weight:700;color:#F0EFEB;letter-spacing:-0.01em;\">Rodrigo Rocha<\u002Fdiv>\n            <p style=\"font-size:13px;color:#FF6B5E;font-weight:600;margin:5px 0 12px;\">Palestrante, mentor e autor do livro SEM<\u002Fp>\n            <p style=\"font-size:13px;color:rgba(240,239,235,0.6);line-height:1.55;margin:0;\">Mais de 24 anos em marketing, inovação e crescimento. Foi VP de Marketing e CEO da Amil Dental. Publicitário pela FAAP com MBA pela Columbia, estuda modelos de negócios longevos pelo mundo.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:rgba(255,255,255,0.04);border:1px solid rgba(240,239,235,0.1);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;\">\n          <div style=\"aspect-ratio:1/1;width:100%;background:url(&quot;aded9ceb-7cd5-4d74-8f2f-45d005f1abd2&quot;) center 15%/cover;border-bottom:1px solid rgba(240,239,235,0.08);\"><\u002Fdiv>\n          <div style=\"padding:22px 22px 26px;\">\n            <div style=\"font-size:19px;font-weight:700;color:#F0EFEB;letter-spacing:-0.01em;\">Luccas Adib<\u002Fdiv>\n            <p style=\"font-size:13px;color:#FF6B5E;font-weight:600;margin:5px 0 12px;\">CEO da Hapvida<\u002Fp>\n            <p style=\"font-size:13px;color:rgba(240,239,235,0.6);line-height:1.55;margin:0;\">Executivo à frente da maior empresa de saúde integrada da América Latina, com trajetória marcada pela integração entre gestão, inovação e transformação digital. Formado em Direito pela USP e mestre em Finanças pela HEC Paris.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:rgba(255,255,255,0.04);border:1px solid rgba(240,239,235,0.1);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;\">\n          <div style=\"aspect-ratio:1/1;width:100%;background:url(&quot;77e5db70-6c64-4d61-a593-c716478d6844&quot;) center 12%/cover;border-bottom:1px solid rgba(240,239,235,0.08);\"><\u002Fdiv>\n          <div style=\"padding:22px 22px 26px;\">\n            <div style=\"font-size:19px;font-weight:700;color:#F0EFEB;letter-spacing:-0.01em;\">Frederico Cruz<\u002Fdiv>\n            <p style=\"font-size:13px;color:#FF6B5E;font-weight:600;margin:5px 0 12px;\">CFO no Blanc Hospital<\u002Fp>\n            <p style=\"font-size:13px;color:rgba(240,239,235,0.6);line-height:1.55;margin:0;\">Executivo com trajetória em finanças e gestão de sinistros na saúde suplementar. Já atuou na Bradesco Saúde, na Amil e na Saúde Petrobras. Formado em Estatística pela UERJ e mestre em Administração com ênfase em IA pelo IBMEC.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"margin-top:64px;\">\n      <div style=\"display:flex;align-items:center;gap:14px;margin-bottom:22px;\">\n        <span style=\"font-size:12px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#902B29;\">Painel<\u002Fspan>\n        <span style=\"flex:1;height:1px;background:rgba(240,239,235,0.12);\"><\u002Fspan>\n      <\u002Fdiv>\n      <h3 style=\"font-size:clamp(20px,2.4vw,28px);font-weight:700;letter-spacing:-0.02em;line-height:1.2;color:#F0EFEB;margin:0 0 24px;max-width:820px;\">IA e os novos desafios da gestão em saúde<\u002Fh3>\n      <div class=\"summit-speakers-grid\" style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:18px;\">\n        <div style=\"background:rgba(255,255,255,0.04);border:1px solid rgba(240,239,235,0.1);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;\">\n          <div style=\"aspect-ratio:1/1;width:100%;background:url(&quot;e747f8f3-68f5-48a7-bcc0-6752d376bb3c&quot;) center/cover;border-bottom:1px solid rgba(240,239,235,0.08);\"><\u002Fdiv>\n          <div style=\"padding:22px 22px 26px;\">\n            <div style=\"font-size:19px;font-weight:700;color:#F0EFEB;letter-spacing:-0.01em;\">Hamilton Cardomingo<\u002Fdiv>\n            <p style=\"font-size:13px;color:#FF6B5E;font-weight:600;margin:5px 0 12px;\">Diretor de Operações Saúde na Porto Seguro<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"margin-top:64px;\">\n      <div style=\"display:flex;align-items:center;gap:14px;margin-bottom:22px;\">\n        <span style=\"font-size:12px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#902B29;\">Painel<\u002Fspan>\n        <span style=\"flex:1;height:1px;background:rgba(240,239,235,0.12);\"><\u002Fspan>\n      <\u002Fdiv>\n      <h3 style=\"font-size:clamp(20px,2.4vw,28px);font-weight:700;letter-spacing:-0.02em;line-height:1.2;color:#F0EFEB;margin:0 0 24px;max-width:820px;\">Agentes autônomos, produtividade real e segurança com IA<\u002Fh3>\n      <div class=\"summit-speakers-grid\" style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:18px;\">\n        <div style=\"background:rgba(255,255,255,0.04);border:1px solid rgba(240,239,235,0.1);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;\">\n          <div style=\"aspect-ratio:1/1;width:100%;background:url(&quot;f168a262-5e9b-43b7-998b-c2c5fff3c4cb&quot;) center 15%/cover;border-bottom:1px solid rgba(240,239,235,0.08);\"><\u002Fdiv>\n          <div style=\"padding:22px 22px 26px;\">\n            <div style=\"font-size:19px;font-weight:700;color:#F0EFEB;letter-spacing:-0.01em;\">Andy Young<\u002Fdiv>\n            <p style=\"font-size:13px;color:#FF6B5E;font-weight:600;margin:5px 0 12px;\">Partner at Kaszek<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"margin-top:22px;background:rgba(255,255,255,0.03);border:1px dashed rgba(240,239,23
